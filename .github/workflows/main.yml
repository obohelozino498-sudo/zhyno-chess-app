name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      space:
        description: "Your Hugging Face Space as USERNAME/SPACENAME"
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Get website files
        env:
          SPACE: ${{ inputs.space }}
        run: |
          git clone --depth 1 "https://huggingface.co/spaces/$SPACE" www
          rm -rf www/.git
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zhyno-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
